# Valores por defecto para las aplicaciones Spark lanzadas desde Jupyter o spark-submit.
spark.master                          spark://spark-master:7077
spark.hadoop.fs.defaultFS             hdfs://namenode:8020
spark.sql.session.timeZone            Europe/Madrid

# El driver vive en el contenedor «jupyter»: los executors deben poder volver a él
spark.driver.host                     jupyter
spark.driver.bindAddress              0.0.0.0
spark.driver.port                     7078
spark.blockManager.port               7079
spark.driver.memory                   1g

# Recursos por aplicación (2 workers x 2 cores). Se pueden cambiar en crear_spark(...)
spark.executor.memory                 1g
spark.executor.cores                  2
spark.cores.max                       4
spark.sql.shuffle.partitions          8
spark.sql.adaptive.enabled            true
# Si una fecha no encaja con el patrón, devuelve null en lugar de lanzar una excepción
spark.sql.legacy.timeParserPolicy     CORRECTED

# Historial de eventos (para revisar trabajos terminados en la fase 4)
spark.eventLog.enabled                false

# Métricas en formato Prometheus (fase 4)
spark.ui.prometheus.enabled           true
spark.metrics.conf.*.sink.prometheusServlet.class   org.apache.spark.metrics.sink.PrometheusServlet
spark.metrics.conf.*.sink.prometheusServlet.path    /metrics/prometheus
